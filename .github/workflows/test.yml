# The tests, on every push and pull request.
name: Tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the compiler (C bootstrap -> Sloppy, which compiles itself)
        run: tools/bootstrap.sh
      - name: Test
        shell: bash    # (-e and pipefail: a failure anywhere, even before a pipe, fails the step)
        run: |
          python3 tools/runtests.py
          python3 tools/runtests.py --compiler sloppy
          python3 tools/runtests.py --compiler sloppy --release
          python3 tools/runtests.py --compiler sloppy --target wasm
          python3 tools/runtests.py --compiler sloppy --target wasm --release
          python3 tools/lsptest.py
          python3 tools/rendertest.py --no-gpu
          python3 tools/watchtest.py
          sudo apt-get install -y -q spirv-tools libvulkan1 mesa-vulkan-drivers >/dev/null && python3 tools/spirvtest.py
          # (through Vulkan as well, on Mesa's software driver, with no display)
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json python3 tools/rendertest.py --vulkan-only | tee /tmp/vk.txt
          if grep -q skip /tmp/vk.txt; then echo 'a Vulkan render test was skipped'; exit 1; fi
          python3 tools/fuzz_errors.py 3000 --seed 1
      - name: Keep the rendered frames (when a test failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frames
          path: /tmp/sloppy-render/*.png

  # the compiler for Linux on arm64 (made on x86-64), its tests on an arm64 machine, and the
  # compiler compiling itself there (it must make the same bytes)
  arm64-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler, then the compiler for arm64
        run: |
          tools/bootstrap.sh
          bin/sloppy build --target linux-arm64 compiler/main.jo -o sloppy-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-arm64
          path: sloppy-arm64
  arm64:
    needs: arm64-compiler
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sloppy-arm64
      - name: Test
        shell: bash
        run: |
          mkdir -p bin && mv sloppy-arm64 bin/sloppy && chmod +x bin/sloppy
          export SLOPPY_LIB=$PWD/lib
          bin/sloppy --version
          bin/sloppy build compiler/main.jo -o /tmp/self
          cmp /tmp/self bin/sloppy
          python3 tools/runtests.py --compiler sloppy
          python3 tools/runtests.py --compiler sloppy --release

  # the compiler for Windows (made on Linux) and its tests on Windows itself
  windows-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler, then the compiler for Windows
        run: |
          tools/bootstrap.sh
          bin/sloppy build --target windows compiler/main.jo -o bin/sloppy.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-exe
          path: bin/sloppy.exe
  windows:
    needs: windows-compiler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sloppy-exe
          path: bin
      - name: Test
        shell: bash
        run: |
          python tools/runtests.py --compiler sloppy
          python tools/runtests.py --compiler sloppy --release
          python tools/lsptest.py
          python tools/watchtest.py
          python tools/rendertest.py --no-gpu
      - name: A debugger (cdb) finds functions and lines through the PDB
        shell: bash
        run: |
          mkdir -p dbg
          SLOPPY_LIB="$PWD/lib" bin/sloppy.exe build tests/t/unwind.jo -o dbg/unwind.exe
          "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -lines -y dbg -c "bp unwind!f3; g; k; q" dbg/unwind.exe > dbg/out.txt
          grep -q "unwind!f2+0x[0-9a-f]* \[.*unwind.jo @ 55\]" dbg/out.txt || { cat dbg/out.txt; exit 1; }
      - name: The compiler compiles itself on Windows to the same program
        shell: bash
        run: |
          mkdir -p again
          bin/sloppy.exe build compiler/main.jo -o again/sloppy.exe
          cmp bin/sloppy.exe again/sloppy.exe
