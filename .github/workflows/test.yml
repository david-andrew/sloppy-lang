# The tests, on every push and pull request.
name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Build the compiler (C bootstrap -> Sloppy, which compiles itself)
        run: tools/bootstrap.sh
      - name: Test
        shell: bash    # (-e and pipefail: a failure anywhere, even before a pipe, fails the step)
        run: |
          python3 tools/runtests.py
          python3 tools/runtests.py --compiler sloppy
          python3 tools/runtests.py --compiler sloppy --release
          python3 tools/runtests.py --compiler sloppy --target wasm
          python3 tools/runtests.py --compiler sloppy --target wasm --release
          python3 tools/lsptest.py
          python3 tools/rendertest.py --no-gpu
          python3 tools/watchtest.py
          python3 tools/termtest.py
          sudo apt-get install -y -q spirv-tools libvulkan1 mesa-vulkan-drivers >/dev/null && python3 tools/spirvtest.py
          # (through Vulkan as well, on Mesa's software driver, with no display)
          VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json python3 tools/rendertest.py --vulkan-only | tee /tmp/vk.txt
          if grep -q skip /tmp/vk.txt; then echo 'a Vulkan render test was skipped'; exit 1; fi
          python3 tools/fuzz_errors.py 3000 --seed 1
          # (sloppy build -g: what gdb shows of variables, with lib/debug's printers)
          sudo apt-get install -y -q gdb >/dev/null && python3 tools/dbgtest.py
          python3 tools/pkgtest.py
          python3 tools/nettest.py
      - name: Keep the rendered frames (when a test failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-frames
          path: /tmp/sloppy-render/*.png

  # compile speed: the instructions compiling takes, against the commit before (fails above 1%)
  speed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the compiler
        run: tools/bootstrap.sh
      - name: Compare with the commit before
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # (user-space instruction counters, for tools/icount; CI's virtual machines have none:
          # then valgrind counts)
          sudo sysctl -q -w kernel.perf_event_paranoid=1
          sudo apt-get install -y -q valgrind >/dev/null
          base=HEAD~1
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$(git merge-base "$BEFORE" HEAD); fi
          python3 tools/speedcheck.py --base "$base" --release

  # the compiler for Linux on arm64 (made on x86-64), its tests on an arm64 machine, and the
  # compiler compiling itself there (it must make the same bytes)
  arm64-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler, then the compiler for arm64
        run: |
          tools/bootstrap.sh
          bin/sloppy build --target linux-arm64 compiler/main.jo -o sloppy-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-arm64
          path: sloppy-arm64
  arm64:
    needs: arm64-compiler
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sloppy-arm64
      - name: Test
        shell: bash
        run: |
          mkdir -p bin && mv sloppy-arm64 bin/sloppy && chmod +x bin/sloppy
          export SLOPPY_LIB=$PWD/lib
          bin/sloppy --version
          bin/sloppy build compiler/main.jo -o /tmp/self
          cmp /tmp/self bin/sloppy
          python3 tools/runtests.py --compiler sloppy
          python3 tools/runtests.py --compiler sloppy --release
          python3 tools/watchtest.py
          python3 tools/termtest.py
          sudo apt-get install -y -q gdb >/dev/null && python3 tools/dbgtest.py
          python3 tools/nettest.py

  # the compiler for macOS on Apple Silicon (made on Linux), a program it made run on a Mac, and
  # there the compiler compiling itself (the same bytes) and its tests
  macos-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler, then the compiler for macOS
        run: |
          tools/bootstrap.sh
          mkdir -p out && bin/sloppy build --target macos compiler/main.jo -o out/sloppy
          printf 'main = ():\n    print("hello from macOS")\n' > /tmp/hello.jo
          bin/sloppy build --target macos /tmp/hello.jo -o out/hello
          # (what the installer downloads)
          python3 tools/release.py && cp build/release/sloppy-macos-arm64.tar.gz* out/
      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-macos
          path: out
  macos:
    needs: macos-compiler
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sloppy-macos
          path: out
      - name: A program made on Linux
        timeout-minutes: 3
        run: |
          chmod +x out/hello out/sloppy
          codesign -v out/hello
          # (where it is, if it has not finished in 10 seconds)
          run() {
            "$@" & pid=$!
            for i in $(seq 1 20); do kill -0 $pid 2>/dev/null || break; sleep 0.5; done
            if kill -0 $pid 2>/dev/null; then sample $pid 1 -mayDie 2>&1 | head -60; kill -9 $pid; return 1; fi
            wait $pid
          }
          SLOPPY_NO_CRASH_HANDLER=1 run out/hello
          run out/hello
      - name: The compiler
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p bin /tmp/self && cp out/sloppy bin/sloppy
          export SLOPPY_LIB=$PWD/lib
          bin/sloppy --version
          bin/sloppy build compiler/main.jo -o /tmp/self/sloppy
          cmp /tmp/self/sloppy bin/sloppy
          python3 tools/runtests.py --compiler sloppy
          python3 tools/runtests.py --compiler sloppy --release
          python3 tools/lsptest.py
          python3 tools/watchtest.py
          python3 tools/termtest.py
          python3 tools/pkgtest.py
          python3 tools/nettest.py
      - name: A debugger (lldb) on programs built with -g
        timeout-minutes: 8
        run: SLOPPY_LIB=$PWD/lib python3 tools/dbgtest.py
      - name: Metal (the shaders through Apple's compiler; the render scenes on the runner's virtual GPU)
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        run: |
          export SLOPPY_LIB=$PWD/lib
          export TMPDIR=/tmp
          python3 tools/msltest.py || true
          SLOPPY_METAL=1 python3 tools/rendertest.py --gpu || true
          mkdir -p /tmp/metal-render && cp /tmp/sloppy-render/*.png /tmp/metal-render/ || true
      - name: Games (software renderer, OpenGL), and one in its window on the screen
        timeout-minutes: 15
        shell: bash
        run: |
          export SLOPPY_LIB=$PWD/lib
          export TMPDIR=/tmp                # (the frames go to /tmp/sloppy-render, kept below)
          python3 tools/rendertest.py --no-gpu
          # (OpenGL: the runner's is Apple's software renderer)
          SLOPPY_GL_SOFTWARE=1 python3 tools/rendertest.py --gpu
          bin/sloppy build examples/rebound/rebound.jo -o /tmp/rebound
          SLOPPY_GL_SOFTWARE=1 /tmp/rebound & pid=$!
          sleep 6
          screencapture -x /tmp/screen.png
          kill $pid
          # an app bundle (-o Name.app): its Info.plist, its signed program, and the Finder's way of
          # opening it (LaunchServices)
          bin/sloppy build examples/rebound/rebound.jo --target macos -o /tmp/Rebound.app
          plutil -lint /tmp/Rebound.app/Contents/Info.plist
          codesign --verify --strict --verbose=2 /tmp/Rebound.app
          open --env SLOPPY_GL_SOFTWARE=1 /tmp/Rebound.app
          sleep 6
          pgrep -x Rebound
          screencapture -x /tmp/screen-app.png
          pkill -x Rebound
      - name: The installer
        shell: bash
        run: |
          env -i HOME=/tmp/home PATH=/usr/bin:/bin SHELL=/bin/zsh SLOPPY_DOWNLOAD_BASE=file://$PWD/out bash tools/install.sh v0.0.0
          printf 'main = ():\n    print("installed")\n' > /tmp/i.jo
          /tmp/home/.sloppy/bin/sloppy /tmp/i.jo
      - name: Keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-frames
          path: |
            /tmp/screen.png
            /tmp/screen-app.png
            /tmp/sloppy-render/*.png
            /tmp/metal-render/*.png

  # the compiler for Windows (made on Linux) and its tests on Windows itself
  windows-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler, then the compiler for Windows
        run: |
          tools/bootstrap.sh
          bin/sloppy build --target windows compiler/main.jo -o bin/sloppy.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-exe
          path: bin/sloppy.exe
  windows:
    needs: windows-compiler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sloppy-exe
          path: bin
      - name: Test
        shell: bash
        run: |
          python tools/runtests.py --compiler sloppy
          python tools/runtests.py --compiler sloppy --release
          python tools/lsptest.py
          python tools/watchtest.py
          python tools/rendertest.py --no-gpu
          python tools/pkgtest.py
          python tools/dbgtest.py
          python tools/nettest.py
      - name: A debugger (cdb) finds functions and lines through the PDB
        shell: bash
        run: |
          mkdir -p dbg
          SLOPPY_LIB="$PWD/lib" bin/sloppy.exe build tests/t/unwind.jo -o dbg/unwind.exe
          "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" -lines -y dbg -c "bp unwind!f3; g; k; q" dbg/unwind.exe > dbg/out.txt
          grep -q "unwind!f2+0x[0-9a-f]* \[.*unwind.jo @ 55\]" dbg/out.txt || { cat dbg/out.txt; exit 1; }
      - name: The compiler compiles itself on Windows to the same program
        shell: bash
        run: |
          mkdir -p again
          bin/sloppy.exe build compiler/main.jo -o again/sloppy.exe
          cmp bin/sloppy.exe again/sloppy.exe
