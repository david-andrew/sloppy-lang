# The fuzzers, each night with new seeds: random programs built four ways and for arm64 (tools/fuzz.py), broken
# programs (tools/fuzz_errors.py), and compute functions and fragment shaders on the CPU, the
# software renderer and Mesa (lavapipe's Vulkan, llvmpipe's OpenGL) (tools/gpufuzz.py). A failure
# keeps its programs; tools/gpufuzz.py --reduce shrinks one, and each bug found becomes a test.
name: Nightly
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # (other seeds each night, and the same on a re-run)
      SEED: ${{ github.run_number }}000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Build the compiler
        run: tools/bootstrap.sh
      - name: Mesa (Vulkan and OpenGL in software)
        run: sudo apt-get install -y -q spirv-tools libvulkan1 mesa-vulkan-drivers libegl1 libgles2 libgl1-mesa-dri xvfb qemu-user-static >/dev/null
      - name: Programs, built four ways
        if: success() || failure()
        run: python3 tools/fuzz.py 1500 --seed "$SEED"
      - name: Programs on arm64 (under qemu), against x86-64
        if: success() || failure()
        run: python3 tools/fuzz.py 500 --no-wasm --arm64 --seed "${SEED}5"
      - name: Broken programs
        if: success() || failure()
        run: python3 tools/fuzz_errors.py 20000 --seed "$SEED"
      - name: Compute functions (CPU, Vulkan)
        if: success() || failure()
        run: python3 tools/gpufuzz.py 1500 --seed "$SEED"
      - name: Fragment shaders (software, OpenGL, Vulkan)
        if: success() || failure()
        # (OpenGL draws in a window: on a virtual X server)
        run: xvfb-run -a python3 tools/gpufuzz.py 500 --shaders --seed "$SEED"
      - name: Keep the failing programs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: |
            build/fuzz/fail_*
            build/fuzz/crash_*
            build/gpufuzz/fail_*
