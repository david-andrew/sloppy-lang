# macOS on Apple Silicon: the compiler for macOS (made on Linux), then on a Mac: programs it
# builds, and its tests.
name: macOS
on:
  push:
    branches: [master, macos-port]
  pull_request:
  workflow_dispatch:
jobs:
  macos-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compiler, then the compiler for macOS
        run: |
          tools/bootstrap.sh
          mkdir -p out && bin/sloppy build --target macos compiler/main.jo -o out/sloppy
          printf 'main = ():\n    print("hello from macOS")\n' > /tmp/hello.jo
          bin/sloppy build --target macos /tmp/hello.jo -o out/hello
      - uses: actions/upload-artifact@v4
        with:
          name: sloppy-macos
          path: out
  macos:
    needs: macos-compiler
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sloppy-macos
          path: out
      - name: A program made on Linux
        run: |
          chmod +x out/hello out/sloppy
          codesign -v -v out/hello || true
          out/hello
      - name: The compiler
        shell: bash
        run: |
          mkdir -p bin /tmp/self && cp out/sloppy bin/sloppy
          export SLOPPY_LIB=$PWD/lib
          bin/sloppy --version
          bin/sloppy build compiler/main.jo -o /tmp/self/sloppy
          cmp /tmp/self/sloppy bin/sloppy
          python3 tools/runtests.py --compiler sloppy
